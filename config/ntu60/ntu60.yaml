# Setting
gpus: [0]
seed: 1
debug: False
pretrained_path:
work_dir: ./workdir

# Data Loader
dataset: ntu60
dataset_args:
  graph: ntu60
  labeling: intra-inter
  inter_link: pairwise
  hop: 1
  dilation: 2
  train_batch_size: 16
  eval_batch_size: 16
  inputs: J
  transform: False
  window: [10, 30]
  input_dims: 3
  person_id: [0,1]
  root_folder: ./data

# Model
model_type: Trans-GCN
model_args:
  use_att: True
  kernel_size: [3,2]
  dilation: [2,3]
  reduct_ratio: 2
  so2_arg:
    heads: 4
    angle_partitions: 4
    rot_one_axis: False


# Optimizer
# SGD, Adam
optimizer: SGD
optimizer_args:
  SGD:
    lr: 0.1
    momentum: 0.9
    nesterov: True
    weight_decay: 0.0002
  Adam:
    lr: 0.1
    betas: [0.9,0.99]
    weight_decay: 0.0002

# Scheduler
# step, cosine
lr_scheduler: cosine
scheduler_args:
  step:
    max_epoch: 70
    warm_up: 10
    step_lr: [20,50]
  cosine:
    max_epoch: 65
    warm_up: 5